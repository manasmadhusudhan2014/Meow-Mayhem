<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CAT OPS - Medium Graphics - Forest Survival</title>
<style>
*{
    box-sizing:border-box;
}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07100b;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}
button,input{
    font:inherit;
}
button{
    cursor:pointer;
    border:0;
    border-radius:8px;
    padding:10px 15px;
    font-weight:bold;
}
.hidden{
    display:none!important;
}
/* ================= HOME ================= */
#app{
    width:100vw;
    height:100vh;
}
.screen{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}
.panel{
    width:min(1100px,94vw);
    max-height:94vh;
    overflow:auto;
    background:rgba(10,20,13,.97);
    border:2px solid #365d3d;
    border-radius:18px;
    padding:25px;
    box-shadow:0 0 30px #000;
}
.logo{
    text-align:center;
    font-size:clamp(38px,7vw,58px);
    color:#8cff82;
    text-shadow:0 0 15px #29a52d;
    margin:10px 0 0;
}
.subtitle{
    text-align:center;
    color:#9eaf9f;
    margin-bottom:25px;
}
.nickname{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:20px 0;
}
.nickname input{
    width:300px;
    padding:13px;
    border-radius:8px;
    border:2px solid #456b4b;
    background:#111a13;
    color:white;
    outline:none;
}
.primary{
    background:#52d653;
    color:#071008;
}
.primary:hover{
    background:#72ed72;
}
.gold{
    color:#ffd84a;
}
.home-buttons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    margin:25px 0;
}
.home-buttons button{
    background:#17271a;
    color:#fff;
    border:1px solid #46634a;
}
.home-buttons button:hover{
    background:#27452b;
}
.stats{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin:20px 0;
}
.stat{
    background:#111c13;
    border:1px solid #334c37;
    border-radius:10px;
    padding:12px 20px;
}
/* ================= TABLE ================= */
.table-wrap{
    overflow:auto;
    max-height:65vh;
    border:1px solid #304a34;
    border-radius:10px;
}
table{
    border-collapse:collapse;
    width:100%;
    min-width:850px;
}
th,td{
    border-bottom:1px solid #263b29;
    padding:10px;
    text-align:left;
}
th{
    position:sticky;
    top:0;
    background:#162719;
    color:#9cff92;
    z-index:2;
}
tr:hover td{
    background:#142217;
}
.price{
    color:#ffd84a;
    font-weight:bold;
}
.locked{
    color:#ff7777;
}
.unlocked{
    color:#78ed78;
}
/* ================= SHOP ================= */
.coming-soon{
    margin:18px 0;
    padding:16px;
    border:2px dashed #f2c94c;
    border-radius:14px;
    background:rgba(255,215,80,.08);
    text-align:center;
}
.coming-soon h3{
    margin:0 0 8px;
}
.coming-soon p{
    margin:6px 0;
}
#christmasEventStatus{
    font-weight:bold;
    margin-top:8px;
}
.shop-tabs{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:15px;
}
.shop-tabs button{
    background:#17271a;
    color:#fff;
}
.shop-tabs button.active{
    background:#58d85a;
    color:#071008;
}
.shop-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:12px;
}
.card{
    background:#111b13;
    border:1px solid #314a35;
    border-radius:12px;
    padding:15px;
}
.card h3{
    margin-top:0;
    color:#a2ff9a;
}
.card p{
    color:#a8b5aa;
    min-height:40px;
}
.card button{
    width:100%;
    background:#263b29;
    color:white;
}
.card button.buy{
    background:#4bc84d;
    color:#071008;
}
.card button.equipped{
    background:#6e7c70;
    color:#fff;
}
.card button.cant{
    background:#542b2b;
}
/* ================= GAME ================= */
#gameScreen{
    display:block;
    position:relative;
    width:100vw;
    height:100vh;
    background:#071009;
    overflow:hidden;
}
#gameScreen, #gameCanvas{
    touch-action:none;
}
#gameCanvas{
    display:block;
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
}
.hud{
    position:absolute;
    top:10px;
    left:10px;
    right:10px;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
    z-index:5;
}
.hudBox{
    background:rgba(5,12,7,.85);
    border:1px solid #426446;
    border-radius:9px;
    padding:8px 12px;
}
.bar{
    width:190px;
    height:15px;
    background:#301717;
    border-radius:10px;
    overflow:hidden;
    margin-top:4px;
}
.bar div{
    height:100%;
    background:#56e55b;
}
#bossBar{
    position:absolute;
    top:82px;
    left:50%;
    transform:translateX(-50%);
    width:min(650px,70vw);
    background:#220909;
    border:1px solid #8c3838;
    z-index:5;
    text-align:center;
    padding:7px;
    border-radius:8px;
    display:none;
}
#bossFill{
    height:12px;
    background:#ef4444;
    border-radius:5px;
}
#gameMessage{
    position:absolute;
    top:42%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    pointer-events:none;
    z-index:7;
}
.bigMessage{
    font-size:48px;
    font-weight:bold;
    text-shadow:0 3px 15px #000;
}
.controls{
    position:absolute;
    bottom:12px;
    left:12px;
    color:#c7d4c8;
    background:rgba(5,12,7,.65);
    padding:8px 12px;
    border-radius:8px;
    z-index:5;
    font-size:13px;
}
/* ================= TOUCH CONTROLS ================= */
.touchControls{
    position:absolute;
    inset:0;
    z-index:10;
    pointer-events:none;
    display:none;
}
.joystick{
    position:absolute;
    width:120px;
    height:120px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.25);
    background:rgba(20,35,23,.45);
    pointer-events:auto;
    touch-action:none;
}
.joystickKnob{
    position:absolute;
    width:52px;
    height:52px;
    left:34px;
    top:34px;
    border-radius:50%;
    background:rgba(140,255,130,.7);
    border:2px solid rgba(255,255,255,.5);
}
#moveStick{left:18px;bottom:22px}
#aimStick{right:18px;bottom:22px}
.touchHint{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    bottom:8px;
    padding:5px 9px;
    border-radius:8px;
    background:rgba(0,0,0,.4);
    font-size:11px;
    color:#d9e4da;
}
/* ================= MOBILE ================= */
@media (pointer: coarse) and (hover: none){
    .touchControls{display:block;}
}
@media(max-width:700px){
    .panel{
        padding:15px;
    }
    .nickname{
        flex-direction:column;
        align-items:center;
    }
    .nickname input{
        width:90%;
    }
    .hud{
        font-size:11px;
    }
    .bar{
        width:120px;
    }
    .bigMessage{
        font-size:34px;
    }
    .controls{
        font-size:10px;
    }
}
</style>
<style id="catops-clean-main">
.main-screen, #mainScreen {
  max-width:1100px;
  margin:0 auto;
}
.main-screen > .panel, #mainScreen > .panel {
  margin:12px auto;
}
.main-screen .panel:first-child, #mainScreen .panel:first-child {
  margin-top:0;
}
@media(max-width:760px){
  .main-screen, #mainScreen { width:100%; padding:8px; box-sizing:border-box; }
  .main-screen .panel, #mainScreen .panel { width:100%; box-sizing:border-box; }
}
</style>
<style id="catops-final-compact-ui">
#changeNickname{
  display:inline-block !important;
  width:125px !important;
  min-width:125px !important;
  max-width:125px !important;
  height:36px !important;
  min-height:36px !important;
  padding:6px 8px !important;
  margin:4px !important;
  font-size:13px !important;
  white-space:nowrap !important;
}
#newNickname{
  display:inline-block !important;
  width:200px !important;
  max-width:100% !important;
  height:36px !important;
  min-height:36px !important;
  box-sizing:border-box !important;
}
#changeNicknamePanel{
  padding:9px !important;
}
#changeNicknamePanel h3{
  margin:2px 0 6px !important;
}
#changeNicknamePanel #nicknameMessage{
  font-size:12px !important;
}
</style>
</head>
<body>
<div id="app">
    <!-- Main Screen View -->
    <div id="mainScreen" class="screen">
        <div class="panel">
            <h1 class="logo">CAT OPS</h1>
            <p class="subtitle">Forest Survival Mode</p>
            <div class="nickname">
                <input type="text" id="playerNickname" placeholder="Enter Agent Nickname..." value="CatAgent">
                <button class="primary" id="startBtn">START OPERATION</button>
            </div>
            <div class="home-buttons">
                <button id="openShopBtn">🐾 WEAPONS & SKINS SHOP</button>
            </div>
        </div>
    </div>

    <!-- Gameplay View -->
    <div id="gameScreen" class="screen hidden">
        <canvas id="gameCanvas"></canvas>
        <div class="hud">
            <div class="hudBox">
                <div>HEALTH</div>
                <div class="bar"><div id="hpFill"></div></div>
            </div>
            <div class="hudBox">
                <div>SCORE: <span id="scoreText" class="gold">0</span></div>
            </div>
        </div>
        <div id="gameMessage" class="hidden">
            <div class="bigMessage" id="msgText">GAME OVER</div>
            <button class="primary" id="restartBtn" style="margin-top:20px;pointer-events:auto;">TRY AGAIN</button>
        </div>
        <div class="controls">WASD / Arrow Keys to Move | Click to Shoot</div>
    </div>
</div>

<script>
// ================= SOUND SYNTHESIZER ENGINE =================
const Sound = {
    ctx: null,
    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
    },
    playShoot() {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, this.ctx.currentTime);
Use code with caution.
osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.15);
gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.15);
osc.start();
osc.stop(this.ctx.currentTime + 0.15);
},
playExplosion() {
this.init();
const osc = this.ctx.createOscillator();
const gain = this.ctx.createGain();
osc.connect(gain);
gain.connect(this.ctx.destination);
osc.type = 'triangle';
osc.frequency.setValueAtTime(180, this.ctx.currentTime);
osc.frequency.linearRampToValueAtTime(40, this.ctx.currentTime + 0.3);
gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
osc.start();
osc.stop(this.ctx.currentTime + 0.3);
},
playJingle(isWin) {
this.init();
const notes = isWin ? [440, 554, 659, 880] :;
notes.forEach((freq, idx) => {
const osc = this.ctx.createOscillator();
const gain = this.ctx.createGain();
osc.connect(gain);
gain.connect(this.ctx.destination);
osc.type = 'sine';
osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.1);
gain.gain.setValueAtTime(0.15, this.ctx.currentTime + idx * 0.1);
gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.1 + 0.15);
osc.start(this.ctx.currentTime + idx * 0.1);
osc.stop(this.ctx.currentTime + idx * 0.1 + 0.15);
});
}
};
// ================= GAME ENGINE MINIMAL =================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let gameRunning = false;
let score = 0;
let player = { x: 0, y: 0, hp: 100, maxHp: 100, size: 25 };
let keys = {};
let bullets = [];
let enemies = [];
let mouse = { x: 0, y: 0 };
function resizeCanvas() {
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('mousedown', () => {
if (!gameRunning) return;
Sound.playShoot();
let dx = mouse.x - player.x;
let dy = mouse.y - player.y;
let dist = Math.hypot(dx, dy);
bullets.push({
x: player.x,
y: player.y,
vx: (dx / dist) * 8,
vy: (dy / dist) * 8,
size: 5
});
});
function spawnEnemy() {
if (!gameRunning) return;
let edge = Math.floor(Math.random() * 4);
let x, y;
if (edge === 0) { x = Math.random() * canvas.width; y = -20; }
else if (edge === 1) { x = canvas.width + 20; y = Math.random() * canvas.height; }
else if (edge === 2) { x = Math.random() * canvas.width; y = canvas.height + 20; }
else { x = -20; y = Math.random() * canvas.height; }
enemies.push({ x, y, speed: 2, size: 20 });
setTimeout(spawnEnemy, Math.max(400, 1500 - score * 10));
}
function update() {
if (!gameRunning) return;
if (keys['w'] || keys['arrowup']) player.y -= 4;
if (keys['s'] || keys['arrowdown']) player.y += 4;
if (keys['a'] || keys['arrowleft']) player.x -= 4;
if (keys['d'] || keys['arrowright']) player.x += 4;
player.x = Math.max(player.size, Math.min(canvas.width - player.size, player.x));
player.y = Math.max(player.size, Math.min(canvas.height - player.size, player.y));
bullets.forEach((b, bi) => {
b.x += b.vx;
b.y += b.vy;
if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) bullets.splice(bi, 1);
});
enemies.forEach((e, ei) => {
let dx = player.x - e.x;
let dy = player.y - e.y;
let dist = Math.hypot(dx, dy);
e.x += (dx / dist) * e.speed;
e.y += (dy / dist) * e.speed;
if (dist < player.size + e.size) {
enemies.splice(ei, 1);
player.hp -= 15;
Sound.playExplosion();
document.getElementById('hpFill').style.width = ${Math.max(0, player.hp)}%;
if (player.hp <= 0) {
gameRunning = false;
Sound.playJingle(false);
document.getElementById('gameMessage').classList.remove('hidden');
}
}
bullets.forEach((b, bi) => {
if (Math.hypot(b.x - e.x, b.y - e.y) < b.size + e.size) {
enemies.splice(ei, 1);
bullets.splice(bi, 1);
score += 10;
Sound.playExplosion();
document.getElementById('scoreText').innerText = score;
}
});
});
ctx.clearRect(0, 0, canvas.width, canvas.height);
// Forest Ground Grid
ctx.strokeStyle = '#122517';
ctx.lineWidth = 1;
for(let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
for(let j=0; j<canvas.height; j+=40) { ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(canvas.width,j); ctx.stroke(); }
// Draw Player (Cat Operator)
ctx.fillStyle = '#6bff70';
ctx.beginPath(); ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2); ctx.fill();
ctx.fillStyle = '#051406';
ctx.beginPath(); ctx.arc(player.x - 7, player.y - 4, 3, 0, Math.PI * 2); ctx.arc(player.x + 7, player.y - 4, 3, 0, Math.PI * 2); ctx.fill();
// Draw Bullets
ctx.fillStyle = '#ffff55';
bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2); ctx.fill(); });
// Draw Enemies
ctx.fillStyle = '#ff5555';
enemies.forEach(e => { ctx.beginPath(); ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2); ctx.fill(); });
requestAnimationFrame(update);
}
document.getElementById('startBtn').addEventListener('click', () => {
document.getElementById('mainScreen').classList.add('hidden');
document.getElementById('gameScreen').classList.remove('hidden');
initGame();
});
document.getElementById('restartBtn').addEventListener('click', () => {
document.getElementById('gameMessage').classList.add('hidden');
initGame();
});
function initGame() {
Sound.playJingle(true);
score = 0;
player.hp = 100;
player.x = canvas.width / 2;
player.y = canvas.height / 2;
bullets = [];
enemies = [];
document.getElementById('scoreText').innerText = score;
document.getElementById('hpFill').style.width = '100%';
gameRunning = true;
spawnEnemy();
update();
}
