<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Meow Mayhem</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  overflow:hidden;
  background:#10151f;
  font-family:Arial,sans-serif;
  width:100%;
  height:100%;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

button{
  background:#ff9f43;
  color:white;
  border:none;
  border-radius:12px;
  padding:13px 30px;
  margin:7px;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#ffb45c;
}

input{
  width:300px;
  padding:14px;
  border-radius:10px;
  border:2px solid #444;
  background:#202733;
  color:white;
  font-size:18px;
  text-align:center;
  outline:none;
}

.hidden{
  display:none!important;
}

.screen{
  position:fixed;
  inset:0;
  background:rgba(5,8,14,.96);
  color:white;
  z-index:50;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.screen h1{
  font-size:50px;
  margin:10px;
}

.screen p{
  color:#bbb;
  font-size:18px;
}

#hud{
  position:fixed;
  top:15px;
  left:15px;
  color:white;
  font-size:19px;
  font-weight:bold;
  z-index:10;
  user-select:none;
}

#healthBox{
  width:230px;
  height:20px;
  background:#333;
  border-radius:10px;
  margin-top:7px;
  overflow:hidden;
}

#health{
  width:100%;
  height:100%;
  background:#2ecc71;
}

#weapon{
  margin-top:7px;
  color:#ffd32a;
}

#reload{
  color:#aaa;
  font-size:14px;
  margin-top:4px;
}

#powerup{
  color:#00ffcc;
  margin-top:5px;
}

#bossInfo{
  color:#ff6b81;
  margin-top:5px;
}

#classInfo{
  color:#c084fc;
  margin-top:5px;
}

#coinsHud{
  color:#ffd32a;
  margin-top:5px;
}

#bossWarning,
#miniBossWarning,
#abilityText{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  display:none;
  font-weight:bold;
  text-align:center;
  pointer-events:none;
}

#bossWarning{
  top:20px;
  color:#ff4757;
  font-size:30px;
}

#miniBossWarning{
  top:60px;
  color:#ff9f43;
  font-size:22px;
}

#abilityText{
  top:110px;
  color:#00ffcc;
  font-size:24px;
  text-shadow:0 0 12px #00ffcc;
}

#pauseScreen{
  z-index:40;
  background:rgba(5,8,14,.88);
}

#pauseScreen h1{
  color:#ffd32a;
}

#pauseScreen p{
  font-size:24px;
  color:white;
}

.pauseKey{
  color:#00ffcc;
  font-weight:bold;
}

/* SHOP */

#shop{
  justify-content:flex-start;
  padding:25px;
  overflow:auto;
}

#shop h1{
  margin:5px;
}

.shopCoins{
  color:#ffd32a;
  font-size:22px;
  font-weight:bold;
  margin:8px;
}

#classGrid{
  width:min(1100px,95vw);
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:12px;
  margin:15px 0;
}

.classCard{
  background:#1b2430;
  border:2px solid #303c4d;
  border-radius:15px;
  padding:15px;
  min-height:190px;
}

.classCard.equipped{
  border-color:#00ffcc;
  box-shadow:0 0 15px rgba(0,255,204,.2);
}

.classCard h2{
  margin:3px;
  font-size:21px;
}

.classCost{
  color:#ffd32a;
  font-weight:bold;
  margin:8px;
}

.classUse{
  color:#aaa;
  font-size:14px;
  min-height:40px;
}

.classButton{
  padding:9px 18px;
  font-size:15px;
}

.cooldown{
  color:#00ffcc;
  font-size:13px;
  margin-top:6px;
}

.nicknameSmall{
  color:#aaa;
  margin-top:5px;
}

/* nickname */

#nicknameScreen{
  z-index:60;
}

/* mobile */

@media(max-width:600px){
  #hud{
    font-size:15px;
  }

  #healthBox{
    width:170px;
  }

  .screen h1{
    font-size:38px;
  }
}
</style>
</head>

<body>

<!-- NICKNAME -->

<div id="nicknameScreen" class="screen">

  <h1>🐱 Meow Mayhem</h1>

  <p>Choose your nickname</p>

  <input
    id="nicknameInput"
    maxlength="16"
    placeholder="Enter nickname..."
  >

  <button onclick="saveNickname()">
    CONTINUE
  </button>

</div>


<!-- MAIN MENU -->

<div id="menu" class="screen hidden">

  <h1>🐱 Meow Mayhem</h1>

  <p id="welcomeText"></p>

  <p>🖱️ Mouse — Move & Aim</p>
  <p>SPACE — Shoot</p>
  <p>P — Pause</p>

  <button onclick="startGame()">
    START GAME
  </button>

  <button onclick="openShop()">
    🏪 CLASS SHOP
  </button>

  <button onclick="resetProgress()">
    RESET PROGRESS
  </button>

</div>


<!-- CLASS SHOP -->

<div id="shop" class="screen hidden">

  <h1>🏪 Class Shop</h1>

  <div class="shopCoins">
    🪙 Coins: <span id="shopCoins">0</span>
  </div>

  <div class="nicknameSmall">
    Player: <span id="shopNickname"></span>
  </div>

  <div id="classGrid"></div>

  <button onclick="closeShop()">
    ← BACK
  </button>

</div>


<!-- DEATH -->

<div id="death" class="screen hidden">

  <h1>💀 GULPERS GOT YOU</h1>

  <p id="finalScore">Kills: 0</p>
  <p id="finalCoins">Coins: 0</p>

  <button onclick="startGame()">
    PLAY AGAIN
  </button>

  <button onclick="goMenu()">
    MAIN MENU
  </button>

</div>


<!-- PAUSE -->

<div id="pauseScreen" class="screen hidden">

  <h1>⏸️ PAUSED</h1>

  <p>
    Press <span class="pauseKey">R</span> to Resume
  </p>

</div>


<!-- HUD -->

<div id="hud">

  🐱 <span id="nicknameHud"></span>

  <div>
    Kills: <span id="killText">0</span>
  </div>

  <div id="coinsHud">
    🪙 Coins: <span id="coinText">0</span>
  </div>

  <div id="healthBox">
    <div id="health"></div>
  </div>

  <div id="weapon">
    🔫 Peashooter
  </div>

  <div id="reload">
    🟢 READY
  </div>

  <div id="powerup"></div>

  <div id="classInfo"></div>

  <div id="bossInfo"></div>

</div>

<div id="bossWarning">
  👑 BIG BOSS INCOMING 👑
</div>

<div id="miniBossWarning">
  🔫 MINI-BOSS INCOMING!
</div>

<div id="abilityText"></div>

<canvas id="game"></canvas>


<script>

// =====================================================
// CANVAS
// =====================================================

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}

resize();
window.addEventListener("resize",resize);


// =====================================================
// INPUT
// =====================================================

const keys={};

let mouseX=canvas.width/2;
let mouseY=canvas.height/2;

const mouseFollowSpeed=2.5;

document.addEventListener("keydown",e=>{

  if(e.code==="KeyP" && gameRunning && !paused){
    paused=true;
    document.getElementById("pauseScreen")
      .classList.remove("hidden");
    return;
  }

  if(e.code==="KeyR" && gameRunning && paused){
    paused=false;
    document.getElementById("pauseScreen")
      .classList.add("hidden");
    return;
  }

  keys[e.code]=true;

  if(e.code==="Space"){
    e.preventDefault();
  }

});

document.addEventListener("keyup",e=>{
  keys[e.code]=false;
});

canvas.addEventListener("mousemove",e=>{
  mouseX=e.clientX;
  mouseY=e.clientY;
});


// =====================================================
// PLAYER DATA / SAVE
// =====================================================

let nickname=localStorage.getItem("meowNickname") || "";

let coins=
  Number(localStorage.getItem("meowCoins") || 0);

let ownedClasses=
  JSON.parse(
    localStorage.getItem("meowClasses") ||
    '["peasant"]'
  );

let equippedClass=
  localStorage.getItem("meowEquipped") ||
  "peasant";


function saveData(){

  localStorage.setItem(
    "meowNickname",
    nickname
  );

  localStorage.setItem(
    "meowCoins",
    coins
  );

  localStorage.setItem(
    "meowClasses",
    JSON.stringify(ownedClasses)
  );

  localStorage.setItem(
    "meowEquipped",
    equippedClass
  );

}


// =====================================================
// NICKNAME
// =====================================================

function saveNickname(){

  let value=
    document.getElementById("nicknameInput")
    .value.trim();

  if(!value){
    alert("Please enter a nickname!");
    return;
  }

  nickname=value;
  saveData();

  document
    .getElementById("nicknameScreen")
    .classList.add("hidden");

  updateMenu();

}


function updateMenu(){

  document.getElementById("welcomeText").textContent=
    "Welcome, "+nickname+"! 🐱";

  document.getElementById("nicknameHud").textContent=
    nickname;

}

const classes=[

function getClass(){

  return classes.find(
    c=>c.id===equippedClass
  ) || classes[0];

}


// =====================================================
// CLASS SHOP
// =====================================================

function openShop(){

  document.getElementById("menu")
    .classList.add("hidden");

  document.getElementById("shop")
    .classList.remove("hidden");

  renderShop();

}


function closeShop(){

  document.getElementById("shop")
    .classList.add("hidden");

  document.getElementById("menu")
    .classList.remove("hidden");

  updateMenu();

}


function renderShop(){

  document.getElementById("shopCoins")
    .textContent=coins;

  document.getElementById("shopNickname")
    .textContent=nickname;

  const grid=
    document.getElementById("classGrid");

  grid.innerHTML="";


  for(const c of classes){

    const owned=
      ownedClasses.includes(c.id);

    const equipped=
      equippedClass===c.id;


    const card=
      document.createElement("div");

    card.className=
      "classCard"+
      (equipped?" equipped":"");


    let action="";

    if(equipped){

      action=
        `<button class="classButton" disabled>
          ✅ EQUIPPED
        </button>`;

    }
    else if(owned){

      action=
        `<button class="classButton"
          onclick="equipClass('${c.id}')">
          EQUIP
        </button>`;

    }
    else if(coins>=c.cost){

      action=
        `<button class="classButton"
          onclick="buyClass('${c.id}')">
          BUY
        </button>`;

    }
    else{

      action=
        `<button class="classButton" disabled>
          🔒 NEED ${c.cost.toLocaleString()}
        </button>`;

    }


    card.innerHTML=`

      <h2 style="color:${c.color}">
        ${c.name}
      </h2>

      <div class="classCost">
        🪙 ${c.cost.toLocaleString()}
      </div>

      <div class="classUse">
        ${c.use}
      </div>

      ${action}

    `;

    grid.appendChild(card);

  }

}


function buyClass(id){

  const c=
    classes.find(x=>x.id===id);

  if(!c)
    return;

  if(coins<c.cost){
    return;
  }

  if(ownedClasses.includes(id))
    return;

  coins-=c.cost;

  ownedClasses.push(id);

  equippedClass=id;

  saveData();

  renderShop();

}


function equipClass(id){

  if(!ownedClasses.includes(id))
    return;

  equippedClass=id;

  saveData();

  renderShop();

}


// =====================================================
// RESET
// =====================================================

function resetProgress(){

  if(!confirm(
    "Reset nickname, coins and classes?"
  )){
    return;
  }

  localStorage.removeItem("meowNickname");
  localStorage.removeItem("meowCoins");
  localStorage.removeItem("meowClasses");
  localStorage.removeItem("meowEquipped");

  location.reload();

}


// =====================================================
// COLORS
// =====================================================

const catColors=[
  "#ff9f43",
  "#3498db",
  "#9b59b6",
  "#2ecc71",
  "#e74c3c",
  "#f1c40f"
];


// =====================================================
// WEAPONS
// =====================================================

const weapons=[

  {
    name:"🔫 Peashooter",
    kills:0,
    cooldown:520,
    bullets:1,
    damage:1,
    speed:9,
    spread:0
  },

  {
    name:"🔵 Pistol",
    kills:20,
    cooldown:380,
    bullets:1,
    damage:1,
    speed:11,
    spread:0
  },

  {
    name:"🟣 SMG",
    kills:40,
    cooldown:190,
    bullets:1,
    damage:1,
    speed:12,
    spread:.025
  },

  {
    name:"🟠 Shotgun",
    kills:70,
    cooldown:650,
    bullets:4,
    damage:1,
    speed:10,
    spread:.22
  },

  {
    name:"🔴 Double Blaster",
    kills:100,
    cooldown:330,
    bullets:2,
    damage:2,
    speed:13,
    spread:.10
  }

];


function currentWeapon(){

  let result=weapons[0];

  for(const weapon of weapons){

    if(player.kills>=weapon.kills){
      result=weapon;
    }

  }

  return result;

}


// =====================================================
// GAME VARIABLES
// =====================================================

let player;

let bullets=[];
let enemyBullets=[];
let enemies=[];
let miniBosses=[];
let boss=null;

let gameRunning=false;
let paused=false;

let spawnTimer=0;

let miniBossTimer=15000;
let miniBossActive=false;

let bigBossSpawned=false;


// =====================================================
// MACHINE GUN
// =====================================================

// Appears ONCE every 5 minutes.
// When obtained, lasts 30 seconds.

let machineGun=false;
let machineGunTime=0;

let machineGunDropTimer=300000;

let machineGunDrop=null;


// =====================================================
// CLASS ABILITY
// =====================================================

let classAbilityTimer=100000;

let effects=[];

let turret=null;

let possessedEnemy=null;

let abilityActive=false;


// =====================================================
// RESET PLAYER
// =====================================================

function resetPlayer(){

  player={

    x:canvas.width/2,
    y:canvas.height/2,

    size:25,

    hp:100,
    maxHp:100,

    kills:0,

    color:catColors[0],

    reload:0,
    hurtTimer:0,
    regenTimer:0,

    invisible:false,
    shield:false,

    speedBoost:1,
    damageBoost:1,
    coinBoost:1

  };

}


// =====================================================
// START
// =====================================================

function startGame(){

  resetPlayer();

  bullets=[];
  enemyBullets=[];
  enemies=[];
  miniBosses=[];

  boss=null;

  spawnTimer=500;

  miniBossTimer=15000;
  miniBossActive=false;

  bigBossSpawned=false;

  machineGun=false;
  machineGunTime=0;
  machineGunDropTimer=300000;
  machineGunDrop=null;

  classAbilityTimer=100000;

  effects=[];
  turret=null;
  possessedEnemy=null;

  abilityActive=false;

  gameRunning=true;
  paused=false;

  document.getElementById("menu")
    .classList.add("hidden");

  document.getElementById("death")
    .classList.add("hidden");

  document.getElementById("pauseScreen")
    .classList.add("hidden");

  updateHUD();

}


// =====================================================
// MENU
// =====================================================

function goMenu(){

  gameRunning=false;
  paused=false;

  document.getElementById("death")
    .classList.add("hidden");

  document.getElementById("pauseScreen")
    .classList.add("hidden");

  document.getElementById("menu")
    .classList.remove("hidden");

  updateMenu();

}


// =====================================================
// COINS
// =====================================================

function addCoins(amount){

  amount=
    Math.floor(
      amount*player.coinBoost
    );

  coins+=amount;

  saveData();

}


// Normal kill = 1 coin
function normalKillCoin(){
  addCoins(1);
}


// Mini-boss = 10 coins
function miniBossCoins(){
  addCoins(10);
}


// Big boss = 100 coins
function bigBossCoins(){
  addCoins(100);
}


// =====================================================
// KILL
// =====================================================

function addKill(){

  player.kills++;

  normalKillCoin();


  if(player.kills%10===0){

    let index=
      (player.kills/10)%
      catColors.length;

    player.color=
      catColors[index];

  }


  if(
    player.kills>=50 &&
    !bigBossSpawned
  ){

    bigBossSpawned=true;
    spawnBoss();

  }

}


// =====================================================
// SHOOT
// =====================================================

function shoot(){

  if(!gameRunning || paused)
    return;

  const weapon=currentWeapon();

  if(!machineGun && player.reload>0)
    return;


  const angle=Math.atan2(
    mouseY-player.y,
    mouseX-player.x
  );


  let count=machineGun
    ?1
    :weapon.bullets;

  let damage=machineGun
    ?1
    :weapon.damage;

  damage*=player.damageBoost;

  let speed=machineGun
    ?16
    :weapon.speed;

  let spread=machineGun
    ?.02
    :weapon.spread;


  for(let i=0;i<count;i++){

    let offset=0;

    if(count>1){

      offset=
        (i-(count-1)/2)*
        spread;

    }

    let a=angle+offset;

    bullets.push({

      x:player.x,
      y:player.y,

      dx:Math.cos(a)*speed,
      dy:Math.sin(a)*speed,

      damage:damage,

      size:machineGun?5:6

    });

  }


  if(!machineGun){

    player.reload=
      weapon.cooldown;

  }

}


// =====================================================
// ENEMY SPAWN
// =====================================================

function spawnEnemy(){

  let limit=4;

  if(player.kills>=40)
    limit=5;

  if(player.kills>=70)
    limit=6;

  if(player.kills>=100)
    limit=8;

  if(enemies.length>=limit)
    return;


  const side=
    Math.floor(Math.random()*4);

  let x,y;

  if(side===0){
    x=Math.random()*canvas.width;
    y=-40;
  }
  else if(side===1){
    x=canvas.width+40;
    y=Math.random()*canvas.height;
  }
  else if(side===2){
    x=Math.random()*canvas.width;
    y=canvas.height+40;
  }
  else{
    x=-40;
    y=Math.random()*canvas.height;
  }


  enemies.push({

    x:x,
    y:y,

    size:22,

    speed:.8+Math.random()*.35,

    hp:2,

    color:"#ff4757",

    stunned:0

  });

}


// =====================================================
// MINI BOSS
// =====================================================

function resetMiniBossTimer(){

  miniBossTimer=
    15000+
    Math.random()*15000;

}


function spawnMiniBoss(){

  if(player.kills<20)
    return;

  if(miniBossActive)
    return;


  const side=
    Math.floor(Math.random()*4);

  let x,y;

  if(side===0){
    x=Math.random()*canvas.width;
    y=-70;
  }
  else if(side===1){

// =====================================================
// BULLETS
// =====================================================

function updateBullets(){

  for(let i=bullets.length-1;i>=0;i--){

    const bullet=bullets[i];

    bullet.x+=bullet.dx;
    bullet.y+=bullet.dy;


    if(
      bullet.x<-50 ||
      bullet.x>canvas.width+50 ||
      bullet.y<-50 ||
      bullet.y>canvas.height+50
    ){

      bullets.splice(i,1);
      continue;

    }


    let removed=false;


    // NORMAL ENEMIES

    for(let j=enemies.length-1;j>=0;j--){

      const enemy=enemies[j];

      const hit=Math.hypot(
        bullet.x-enemy.x,
        bullet.y-enemy.y
      );


      if(hit<enemy.size+bullet.size){

        enemy.hp-=bullet.damage;

        bullets.splice(i,1);

        removed=true;


        if(enemy.hp<=0){

          enemies.splice(j,1);

          addKill();

        }

        break;

      }

    }


    if(removed)
      continue;


    // MINI BOSSES

    for(let j=miniBosses.length-1;j>=0;j--){

      const mini=miniBosses[j];

      const hit=Math.hypot(
        bullet.x-mini.x,
        bullet.y-mini.y
      );


      if(hit<mini.size+bullet.size){

        mini.hp-=bullet.damage;

        bullets.splice(i,1);

        removed=true;


        if(mini.hp<=0){

          miniBosses.splice(j,1);

          // Mini boss = 10 coins
          miniBossCoins();

          // Mini boss counts as 2 kills
          player.kills+=2;

          miniBossActive=false;

          resetMiniBossTimer();

        }

        break;

      }

    }


    if(removed)
      continue;


    // BIG BOSS

    if(boss){

      const hit=Math.hypot(
        bullet.x-boss.x,
        bullet.y-boss.y
      );


      if(hit<boss.size+bullet.size){

        boss.hp-=bullet.damage;

        bullets.splice(i,1);


        if(boss.hp<=0){

          boss=null;

          // 50-kill big boss = 100 coins
          bigBossCoins();

          showMessage(
            "👑 BOSS DEFEATED! +100 🪙",
            "#ffd32a",
            2500
          );

        }

      }

    }

  }

}


// =====================================================
// ENEMIES
// =====================================================

function updateEnemies(){

  for(let i=enemies.length-1;i>=0;i--){

    const enemy=enemies[i];


    if(enemy.stunned>0){

      enemy.stunned--;

    }
    else if(possessedEnemy!==enemy){

      let dx=player.x-enemy.x;
      let dy=player.y-enemy.y;

      let distance=Math.hypot(dx,dy);


      if(distance>0){

        enemy.x+=
          dx/distance*
          enemy.speed;

        enemy.y+=
          dy/distance*
          enemy.speed;

      }


      if(
        distance<
        enemy.size+player.size
      ){

        damagePlayer(15);

        enemies.splice(i,1);

      }

    }

  }


  // possessed enemy attacks other enemies

  if(possessedEnemy){

    if(
      !enemies.includes(possessedEnemy)
    ){

      possessedEnemy=null;

    }
    else{

      possessedEnemy.possessedTime--;

      if(possessedEnemy.possessedTime<=0){

        possessedEnemy=null;

      }
      else{

        for(const target of enemies){

          if(target===possessedEnemy)
            continue;

          let d=Math.hypot(
            target.x-possessedEnemy.x,
            target.y-possessedEnemy.y
          );

          if(d<150){

            target.hp-=.08;

            if(target.hp<=0){

              let index=enemies.indexOf(target);

              if(index>=0){

                enemies.splice(index,1);
                addKill();

              }

            }

            break;

          }

        }

      }

    }

  }

}

function damagePlayer(amount){

  if(player.hurtTimer>0)
    return;

  if(player.shield)

  player.hp-=amount;

  player.hurtTimer=35;

  if(player.hp<=0){

    gameOver();

}

// =====================================================

function updateMiniBosses(){

  for(
    let i=miniBosses.length-1;

    i--
  ){

    const mini=miniBosses[i];

    let dx=player.x-mini.x;
    let dy=player.y-mini.y;

    let distance=Math.hypot(dx,dy);


    if(distance>170){

    }

          enemy.x+=dx/d*3;
          enemy.y+=dy/d*3;

        }

      }

    }


    if(e.type==="bees"){

      for(let i=enemies.length-1;i>=0;i--){

        const enemy=enemies[i];

        if(
          Math.hypot(
            enemy.x-player.x,
            enemy.y-player.y

        ){

          enemy.hp-=.03;

          if(enemy.hp<=0){

    if(e.type==="galaxy"){

      for(let i=enemies.length-1;i>=0;i--){

        enemy.hp-=.015;

        if(enemy.hp<=0){

          enemies.splice(i,1);
          addKill();

        }

      }

    }

  }

}

function updatePlayer(){

  const dy=mouseY-player.y;

  if(distance>2){

    const speed=Math.min(
      mouseFollowSpeed*player.speedBoost,
      distance
    );


    player.x+=dx/distance*speed;
    player.y+=dy/distance*speed;

  }


  player.x=Math.max(
    player.size,
    Math.min(
      canvas.width-player.size,
      player.x
    )
  );


  player.y=Math.max(
    player.size,
    Math.min(
      canvas.height-player.size,
      player.y
    )
  );


  if(keys["Space"])
    shoot();


  if(player.reload>0){

    player.reload-=16;

    if(player.reload<0)
      player.reload=0;

  }


  if(player.hurtTimer>0){

    player.hurtTimer--;
    player.regenTimer=0;

  }
  else{

    player.regenTimer++;

    if(
      player.regenTimer>180 &&
      player.hp<player.maxHp
    ){

      player.hp+=.15;

      if(player.hp>player.maxHp)
        player.hp=player.maxHp;

    }

  }

}


// =====================================================
// DRAW BACKGROUND
// =====================================================

function drawBackground(){

  ctx.fillStyle="#18202b";

  ctx.fillRect(
    0,0,
    canvas.width,
    canvas.height
  );


  ctx.strokeStyle="#222c3a";


  for(
    let x=0;
    x<canvas.width;
    x+=50
  ){

    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,canvas.height);
    ctx.stroke();

  }


  for(
    let y=0;
    y<canvas.height;
    y+=50
  ){

    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(canvas.width,y);
    ctx.stroke();

  }

}


// =====================================================
// DRAW PLAYER
// =====================================================

function drawCat(){

  if(player.invisible){

    ctx.globalAlpha=.18;

  }


  ctx.fillStyle=
    player.hurtTimer>0 &&
    Math.floor(player.hurtTimer/4)%2===0
    ? "white"
    : getClass().color || player.color;


  ctx.beginPath();

  ctx.arc(
    player.x,
    player.y,
    player.size,
    0,
    Math.PI*2
  );

  ctx.fill();


  // ears

  ctx.beginPath();

  ctx.moveTo(
    player.x-20,
    player.y-15
  );

  ctx.lineTo(
    player.x-12,
    player.y-40
  );

  ctx.lineTo(
    player.x-2,
    player.y-15
  );

  ctx.fill();


  ctx.beginPath();

  ctx.moveTo(
    player.x+20,
    player.y-15
  );

  ctx.lineTo(
    player.x+12,
    player.y-40
  );

  ctx.lineTo(
    player.x+2,
    player.y-15
  );

  ctx.fill();


  // eyes

  ctx.fillStyle="white";


  ctx.beginPath();
  ctx.arc(
    player.x-9,
    player.y-5,
    5,
    0,
    Math.PI*2
  );
  ctx.fill();


  ctx.beginPath();
  ctx.arc(
    player.x+9,
    player.y-5,
    5,
    0,
    Math.PI*2
  );
  ctx.fill();


  ctx.globalAlpha=1;


  // shield

  if(player.shield){

    ctx.strokeStyle="#3498db";
    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.arc(
      player.x,
      player.y,
      40,
      0,
      Math.PI*2
    );

    ctx.stroke();

  }

}


// =====================================================
// DRAW GUN
// =====================================================

function drawGun(){

  let angle=Math.atan2(
    mouseY-player.y,
    mouseX-player.x
  );


  ctx.save();

  ctx.translate(
    player.x,
    player.y
  );

  ctx.rotate(angle);


  ctx.fillStyle=
    machineGun
    ? "#00ffcc"
    : "#555";


  ctx.fillRect(
    15,
    -8,
    machineGun?60:38,
    16
  );


  ctx.fillStyle="#111";

  ctx.fillRect(
    machineGun?65:48,
    -5,
    28,
    10
  );


  ctx.fillStyle="#704214";

  ctx.fillRect(
    22,
    6,
    12,
    20
  );


  ctx.restore();

}


// =====================================================
// DRAW ENEMIES
// =====================================================

function drawEnemies(){

  for(const enemy of enemies){

    ctx.fillStyle=
      possessedEnemy===enemy
      ? "#dfe6e9"
      : enemy.color;


    ctx.beginPath();

    ctx.arc(
      enemy.x,
      enemy.y,
      enemy.size,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.arc(
      enemy.x-7,
      enemy.y-4,
      4,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
      enemy.x+7,
      enemy.y-4,
      4,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

}


// =====================================================
// MINI BOSS DRAW
// =====================================================

function drawMiniBosses(){

  for(const mini of miniBosses){

    ctx.fillStyle="#ff9f43";

    ctx.beginPath();

    ctx.arc(
      mini.x,
      mini.y,
      mini.size,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#ffd32a";

    ctx.beginPath();

    ctx.moveTo(
      mini.x-25,
      mini.y-30
    );

    ctx.lineTo(
      mini.x-12,
      mini.y-52
    );

    ctx.lineTo(
      mini.x,
      mini.y-32
    );

    ctx.lineTo(
      mini.x+12,
      mini.y-52
    );

    ctx.lineTo(
      mini.x+25,
      mini.y-30
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle="#ff0000";

    ctx.beginPath();

    ctx.arc(
      mini.x-11,
      mini.y-7,
      6,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
      mini.x+11,
      mini.y-7,
      6,
      0,
      Math.PI*2
    );

    ctx.fill();


    // health

    ctx.fillStyle="#222";

    ctx.fillRect(
      mini.x-35,
      mini.y-65,
      70,
      8
    );

    ctx.fillStyle="#2ecc71";

    ctx.fillRect(
      mini.x-35,
      mini.y-65,
      70*(mini.hp/mini.maxHp),
      8
    );

  }

}


// =====================================================
// BIG BOSS DRAW
// =====================================================

function drawBoss(){

  if(!boss)
    return;


  ctx.fillStyle="#8e44ad";

  ctx.beginPath();

  ctx.arc(
    boss.x,
    boss.y,
    boss.size,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle="#ff0000";

  ctx.beginPath();

  ctx.arc(
    boss.x-23,
    boss.y-10,
    10,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.beginPath();

  ctx.arc(
    boss.x+23,
    boss.y-10,
    10,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle="#222";

  ctx.fillRect(
    boss.x-100,
    boss.y-100,
    200,
    18
  );


  ctx.fillStyle="#e74c3c";

  ctx.fillRect(
    boss.x-100,
    boss.y-100,
    200*(boss.hp/boss.maxHp),
    18
  );

}


// =====================================================
// DRAW BULLETS
// =====================================================

function drawBullets(){

  for(const bullet of bullets){

    ctx.fillStyle=
      machineGun
      ? "#00ffcc"
      : "#ffe600";


    ctx.beginPath();

    ctx.arc(
      bullet.x,
      bullet.y,
      bullet.size,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  for(const bullet of enemyBullets){

    ctx.fillStyle="#ff6b81";

    ctx.beginPath();

    ctx.arc(
      bullet.x,
      bullet.y,
      bullet.size,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

}


// =====================================================
// DRAW MACHINE GUN DROP
// =====================================================

function drawMachineGunDrop(){

  if(!machineGunDrop)
    return;


  const d=
    30+
    Math.sin(Date.now()/150)*8;


  ctx.save();

  ctx.shadowColor="#00ffcc";
  ctx.shadowBlur=25;

  ctx.fillStyle="#00ffcc";

  ctx.fillRect(
    machineGunDrop.x-25,
    machineGunDrop.y-10,
    50,
    20
  );

  ctx.fillStyle="white";

  ctx.font="22px Arial";

  ctx.textAlign="center";

  ctx.fillText(
    "🔫",
    machineGunDrop.x,
    machineGunDrop.y+7
  );

  ctx.restore();

}


// =====================================================
// DRAW CLASS EFFECTS
// =====================================================

function drawEffects(){

  const now=Date.now();


  for(const e of effects){

    const progress=
      1-
      Math.max(0,e.time)/10000;


    // smoke

    if(e.type==="smoke"){

      ctx.strokeStyle="rgba(180,180,180,.4)";
      ctx.lineWidth=5;

      ctx.beginPath();

      ctx.arc(
        e.x,
        e.y,
        30+Math.sin(now/100)*10,
        0,
        Math.PI*2
      );

      ctx.stroke();

    }


    // speed

    if(e.type==="speed"){

      ctx.strokeStyle="#00ffff";
      ctx.lineWidth=3;

      for(let n=0;n<8;n++){

        let a=n*Math.PI/4;

        ctx.beginPath();

        ctx.moveTo(
          player.x+Math.cos(a)*30,
          player.y+Math.sin(a)*30
        );

        ctx.lineTo(
          player.x+Math.cos(a)*60,
          player.y+Math.sin(a)*60
        );

        ctx.stroke();

      }

    }


    // coins

    if(e.type==="coins"){

      ctx.fillStyle="#ffd32a";
      ctx.font="bold 24px Arial";
      ctx.textAlign="center";

      ctx.fillText(
        "+25 🪙",
        e.x,
        e.y-50-progress*50
      );

    }


    // shield

    if(e.type==="shield"){

      ctx.strokeStyle="#3498db";
      ctx.lineWidth=5;

      ctx.beginPath();

      ctx.arc(
        player.x,
        player.y,
        50+Math.sin(now/100)*5,
        0,
        Math.PI*2
      );

      ctx.stroke();

    }


    // jump

    if(e.type==="jump"){

      ctx.strokeStyle="#2ecc71";
      ctx.lineWidth=6;

      ctx.beginPath();

      ctx.arc(
        e.x,
        e.y,
        20+progress*280,
        0,
        Math.PI*2
      );

      ctx.stroke();

    }


    // magic

    if(e.type==="magic"){

      ctx.strokeStyle="#9b59b6";
      ctx.lineWidth=8;

      ctx.beginPath();

      ctx.arc(
        e.x,
        e.y,
        20+progress*230,
        0,
        Math.PI*2
      );

      ctx.stroke();

    }


    // vampire

    if(e.type==="vampire"){

      ctx.strokeStyle="#e74c3c";
      ctx.lineWidth=5;

      for(let n=0;n<12;n++){

        let a=n*Math.PI/6;

        ctx.beginPath();

        ctx.moveTo(
          player.x,
          player.y
        );

        ctx.lineTo(
          player.x+Math.cos(a)*180,
          player.y+Math.sin(a)*180
        );

        ctx.stroke();

      }

    }


    // magnet

    if(e.type==="magnet"){

      ctx.strokeStyle="#ff4757";
      ctx.lineWidth=6;

      ctx.beginPath();

      ctx.arc(
        e.x,
        e.y,
        80+Math.sin(now/100)*10,
        0,
        Math.PI*2
      );

      ctx.stroke();

    }


    // lightning

    if(e.type==="lightning"){

      ctx.strokeStyle="#ffe600";
      ctx.lineWidth=6;

      ctx.beginPath();

      ctx.moveTo(e.x,e.y-250);

      ctx.lineTo(e.x-15,e.y-100);
      ctx.lineTo(e.x+15,e.y-120);
      ctx.lineTo(e.x,e.y);

      ctx.stroke();

    }


    // mutation

    if(e.type==="mutation"){

      ctx.strokeStyle="#00ff88";

      ctx.lineWidth=3;

      ctx.beginPath();

      ctx.arc(
        e.x,
        e.y,
        35+Math.sin(now/100)*8,
        0,
        Math.PI*2
      );

      ctx.stroke();

    }


    // void

    if(e.type==="void"){

      ctx.fillStyle="#080010";

      ctx.beginPath();

      ctx.arc(
        e.x,
        e.y,
        80+Math.sin(now/150)*10,
        0,
        Math.PI*2
      );

      ctx.fill();

      ctx.strokeStyle="#a855f7";
      ctx.lineWidth=7;

      ctx.beginPath();

      ctx.arc(
        e.x,
        e.y,
        100,
        0,
        Math.PI*2
      );

      ctx.stroke();

    }


    // ghost

    if(e.type==="ghost"){

      ctx.strokeStyle="rgba(255,255,255,.8)";
      ctx.lineWidth=4;

      ctx.beginPath();

      ctx.arc(
        e.x,
        e.y,
        45+Math.sin(now/100)*8,
        0,
        Math.PI*2
      );

      ctx.stroke();

    }


    // bees

    if(e.type==="bees"){

      ctx.fillStyle="#f1c40f";

      for(let n=0;n<18;n++){

        let a=
          now/300+
          n*Math.PI*2/18;

        let r=
          50+
          Math.sin(now/150+n)*70;

        ctx.beginPath();

        ctx.arc(
          player.x+
          Math.cos(a)*r,
          player.y+
          Math.sin(a)*r,
          5,
          0,
          Math.PI*2
        );

        ctx.fill();

      }

    }


    // meteor

    if(e.type==="meteor"){

      ctx.fillStyle="#ff6b35";

      ctx.beginPath();

      ctx.arc(
        e.x,
        e.y,
        25+progress*100,
        0,
        Math.PI*2
      );

      ctx.fill();

      ctx.strokeStyle="#ffe600";
      ctx.lineWidth=8;

      ctx.beginPath();

      ctx.arc(
        e.x,
        e.y,
        100+progress*100,
        0,
        Math.PI*2
      );

      ctx.stroke();

    }


    // king

    if(e.type==="king"){

      ctx.strokeStyle="#ffd32a";
      ctx.lineWidth=7;

      ctx.beginPath();

      ctx.arc(
        player.x,
        player.y,
        60+Math.sin(now/100)*8,
        0,
        Math.PI*2
      );

      ctx.stroke();

    }


    // galaxy

    if(e.type==="galaxy"){

      ctx.strokeStyle="#a855f7";

      ctx.lineWidth=5;

      for(let n=0;n<8;n++){

        let a=
          now/500+
          n*Math.PI/4;

        ctx.beginPath();

        ctx.moveTo(
          e.x,
          e.y
        );

        ctx.lineTo(
          e.x+
          Math.cos(a)*500,
          e.y+
          Math.sin(a)*500
        );

        ctx.stroke();

      }

    }


    // UFO

    if(e.type==="ufo"){

      e.x-=5;


      ctx.save();

      ctx.shadowColor="#00ffcc";
      ctx.shadowBlur=25;


      ctx.fillStyle="#777";

      ctx.beginPath();

      ctx.ellipse(
        e.x,
        e.y,
        60,
        20,
        0,
        0,
        Math.PI*2
      );

      ctx.fill();


      ctx.fillStyle="#00ffcc";

      ctx.beginPath();

      ctx.ellipse(
        e.x,
        e.y-10,
        30,
        18,
        0,
        0,
        Math.PI*2
      );

      ctx.fill();


      ctx.fillStyle="rgba(0,255,204,.3)";

      ctx.beginPath();

      ctx.moveTo(
        e.x-35,
        e.y+5
      );

      ctx.lineTo(
        e.x+35,
        e.y+5
      );

      ctx.lineTo(
        e.x+90,
        e.y+250
      );

      ctx.lineTo(
        e.x-90,
        e.y+250
      );

      ctx.closePath();

      ctx.fill();


      ctx.restore();

    }

  }

}


// =====================================================
// DRAW TURRET
// =====================================================

function drawTurret(){

  if(!turret)
    return;


  ctx.fillStyle="#95a5a6";

  ctx.fillRect(
    turret.x-15,
    turret.y-15,
    30,
    30
  );

  ctx.fillStyle="#222";

  ctx.fillRect(
    turret.x,
    turret.y-5,
    35,
    10
  );

}


// =====================================================
// HUD
// =====================================================

function updateHUD(){

  if(!player)
    return;


  document.getElementById("killText")
    .textContent=player.kills;

  document.getElementById("coinText")
    .textContent=coins;

  document.getElementById("health")
    .style.width=
    Math.max(
      0,
      player.hp
    )+"%";


  document.getElementById("weapon")
    .textContent=
    currentWeapon().name;


  if(machineGun){

    document.getElementById("powerup")
      .textContent=
      "🔫 MACHINE GUN — "+
      Math.ceil(machineGunTime/1000)+
      "s";

    document.getElementById("reload")
      .textContent=
      "♾️ NO RELOAD";

  }
  else{

    document.getElementById("powerup")
      .textContent="";

    document.getElementById("reload")
      .textContent=
      player.reload>0
      ? "🔄 Reloading..."
      : "🟢 READY — SPACE TO FIRE";

  }


  const classData=getClass();


  document.getElementById("classInfo")
    .textContent=
    classData.name+
    " — "+
    Math.ceil(
      Math.max(0,classAbilityTimer)/1000
    )+
    "s";


  if(miniBossActive){

    document.getElementById("bossInfo")
      .textContent=
      "👾 MINI-BOSS ACTIVE";

  }
  else if(boss){

    document.getElementById("bossInfo")
      .textContent=
      "👑 BIG BOSS ACTIVE";

  }
  else{

    document.getElementById("bossInfo")
      .textContent="";

  }

}


// =====================================================
// MESSAGE
// =====================================================

function showMessage(text,color,time){

  const el=
    document.getElementById("abilityText");

  el.textContent=text;
  el.style.color=color;
  el.style.display="block";

  setTimeout(()=>{

    el.style.display="none";

  },time);

}


// =====================================================
// GAME OVER
// =====================================================

function gameOver(){

  gameRunning=false;
  paused=false;

  document.getElementById("pauseScreen")
    .classList.add("hidden");


  document.getElementById("finalScore")
    .textContent=
    "🐱 "+nickname+
    " — Kills: "+
    player.kills;


  document.getElementById("finalCoins")
    .textContent=
    "🪙 Total Coins: "+
    coins;


  document.getElementById("death")
    .classList.remove("hidden");

}


// =====================================================
// MAIN LOOP
// =====================================================

function gameLoop(){

  if(gameRunning && !paused){

    updatePlayer();

    updateBullets();

    updateEnemyBullets();

    updateEnemies();

    updateMiniBosses();

    updateBoss();

    updateSpawning();

    updateMiniBossTimer();

    updateMachineGun();

    updateClassAbility();

    updateEffects();

  }


  drawBackground();

  drawMachineGunDrop();

  drawEnemies();

  drawMiniBosses();

  drawBoss();

  drawBullets();

  drawEffects();

  drawTurret();


  if(gameRunning){

    drawCat();
    drawGun();
    updateHUD();

  }


  requestAnimationFrame(gameLoop);

}


// =====================================================
// INITIALIZE
// =====================================================

resetPlayer();

if(nickname){

  document.getElementById("nicknameScreen")
    .classList.add("hidden");

  updateMenu();

}
else{

  document.getElementById("nicknameScreen")
    .classList.remove("hidden");

}


gameLoop();

</script>
